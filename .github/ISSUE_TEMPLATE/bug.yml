name: Bug report
description: Report a reproducible problem using fictional values only.
body:
  - type: markdown
    attributes:
      value: Never include real credentials or personal logs. Use invented examples.
  - type: textarea
    id: input
    attributes:
      label: Fictional input and steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or Node version, operating system, TraceVeil version
    validations:
      required: true
